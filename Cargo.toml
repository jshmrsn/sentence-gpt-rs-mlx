[workspace]
members = ["lib", "config", "app"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
description = "GPT training demo based on microgpt, targeting full simple sentences with Rust, MLX acceleration on Apple Silicon, and a Dioxus desktop app."

[workspace.dependencies]
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlx-rs = "0.25.3"
bincode = "1.3"
